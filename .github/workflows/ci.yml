---
# Managed by modulesync - DO NOT EDIT
# https://voxpupuli.org/docs/updating-files-managed-with-modulesync/
#
# DEVIATION FROM UPSTREAM (puppet-stagehand/stagehand): the `matrix.collection`
# list below and the `openvox9-beta` job are hand-maintained for this module
# and will be reverted by the next modulesync run, same as every other
# stagehand-owned deviation in this repo (see stagehand-security.yml and
# stagehand-puppet9-acceptance.yml headers). Re-apply this comment block and
# the two edits below after any modulesync sync that touches this file.
# Rationale:
#   - puppet7/puppet8/openvox8 are the real, GA collections this module
#     declares support for (metadata.json requirements).
#   - puppet9 has no puppet gem yet (rubygems.org tops out at 8.10.0) and has
#     no `beaker_collection` value in voxpupuli/gha-puppet's beaker.yml@v4
#     (which only knows puppet7, puppet8, openvox7, openvox8, staging), so it
#     cannot run through this dependency-resolution job at all yet. Its
#     unit-test coverage comes from the auto-generated `unit` job matrix
#     (metadata2gha reads metadata.json's puppet requirement -- puppet 7/8
#     are the gems that exist) and its real-package path lives in
#     stagehand-puppet9-acceptance.yml (WIRED, NOT ARMED; see that file's
#     header).
#   - openvox9 DOES have a real gem and a real (beta) apt/yum repo, so it is
#     included below as a best-effort, continue-on-error job rather than
#     silently ignored or folded into the required matrix.
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      beaker_staging_url:
        description: |-
          URL to a staging Server to test unreleased packages.
          We will append the version to the Server and assume all packages are in the same directory.
          Only supported for AIO packages.
        required: false
        type: string
        default: 'https://artifacts.voxpupuli.org/openvox-agent'
      beaker_collection:
        description: |-
          When set to staging, we will download the packages from staging_url.
          Otherwise we will use the official repos. Supported values: puppet7, puppet8, openvox7, openvox8, staging.
          openvox9 also works here (best-effort, beta upstream) but is not one of
          voxpupuli/gha-puppet's officially documented beaker_collection values.
          When unset, we will generate a list of supported collections based on metadata.json.
        required: false
        type: string
      beaker_staging_version:
        description: |-
          The package version we want to test.
          Only used for beaker_collection = staging
        required: false
        type: string

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puppet:
    name: ${{ matrix.collection }} dependency resolution
    strategy:
      fail-fast: false
      matrix:
        collection:
          - puppet7
          - puppet8
          - openvox8
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: ${{ inputs.beaker_collection || matrix.collection }}
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  # Best-effort/beta: openvox9 has a real gem (through 9.0.0.pre.beta2) and a
  # real apt/yum repo (openvox9), but upstream OpenVox itself calls that repo
  # "beta" and explicitly advises against production use, and
  # voxpupuli/gha-puppet's beaker.yml@v4 does not document openvox9 as a
  # supported `beaker_collection` value (only puppet7, puppet8, openvox7,
  # openvox8, staging are documented). This job is therefore kept OUT of the
  # required `puppet` matrix above so an upstream rejection of the collection
  # name, or genuine beta instability, never blocks CI. Promote it into the
  # main matrix once gha-puppet documents openvox9 and/or upstream OpenVox
  # calls openvox9 GA.
  #
  # NOTE: `continue-on-error` is not a legal key on a job that calls a
  # reusable workflow via `uses:` (GitHub Actions only allows
  # name/uses/with/secrets/needs/if/permissions there -- actionlint flags
  # this). "Best-effort" is expressed via the always-green gate job below
  # instead: point required branch-protection checks at
  # `openvox9-beta-gate`, not at `openvox9-beta` itself.
  openvox9-beta:
    name: openvox9 dependency resolution (beta, best-effort)
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: openvox9
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  openvox9-beta-gate:
    name: openvox9 dependency resolution (beta, best-effort) — gate
    needs: openvox9-beta
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "openvox9-beta result was ${{ needs.openvox9-beta.result }} (non-blocking by design)"
